[project]
name = "pp-coding-agent"
version = "0.2.0"
description = "Coding agent CLI with read, bash, edit, write tools and session management (Python port of @earendil-works/pi-coding-agent)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mario Zechner" }]
maintainers = [{ name = "Hangxing Wei", email = "HSPK@users.noreply.github.com" }]
keywords = ["coding-agent", "ai", "llm", "cli", "tui", "agent", "pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    "pp-ai==0.2.0",
    "pp-agent-core==0.2.0",
    "pp-tui==0.2.0",
    "pp-rpc-protocol==0.2.0",
    "pp-rpc-client==0.2.0",
    "pp-rpc-server==0.2.0",
    "pp-telemetry==0.2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "pillow>=11.0",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/HSPK/pp"
Repository = "https://github.com/HSPK/pp"
Issues = "https://github.com/HSPK/pp/issues"
Documentation = "https://github.com/HSPK/pp/tree/main/docs"
Upstream = "https://github.com/earendil-works/pi/tree/main/packages/coding-agent"

[project.scripts]
pp = "pi_coding_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_coding_agent"]

# `docs/`, `examples/` and `README.md` are read at runtime, not just published:
# the system prompt points the model at them so it can answer questions about
# pi itself (see `core/config.py`'s `get_docs_path`). They must land inside the
# installed package, or that capability silently disappears in a wheel install.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "pi_coding_agent/docs"
"examples" = "pi_coding_agent/examples"
"README.md" = "pi_coding_agent/README.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    # Pinned, not floored: `release.yml` gates publishing on `ruff check`, so a
    # new ruff release introducing a rule would block every package's release
    # for a reason unrelated to the release. Bump it deliberately instead.
    "ruff==0.16.3",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-n auto` matters: the suite is dominated by tests that wait (real
# `asyncio.sleep` for OAuth device-code polling, retry backoff, subprocess
# timeouts), so wall time was ~2.5x CPU time when run serially. Override
# with `-n0` to debug a single test.
addopts = "-q -n auto"
filterwarnings = ["error::DeprecationWarning:pi_.*"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
