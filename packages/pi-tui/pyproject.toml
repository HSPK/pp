[project]
name = "pi-tui"
version = "0.0.1"
description = "Terminal UI toolkit (Python port of @earendil-works/pi-tui)"
requires-python = ">=3.11"
dependencies = [
    "wcwidth>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_tui"]

[tool.uv.sources]

