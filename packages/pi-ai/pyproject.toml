[project]
name = "pi-ai"
version = "0.0.1"
description = "Unified LLM provider layer (Python port of @earendil-works/pi-ai)"
requires-python = ">=3.11"
dependencies = [
    "pi-telemetry",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[project.scripts]
pp-ai = "pi_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_ai"]

# The generated model catalog is committed (unlike the TypeScript package,
# which gitignores `src/providers/data/` and hydrates it at build time), so it
# has to ship inside the wheel for `pi_ai.model_catalog` to work offline.
artifacts = [
  "src/pi_ai/providers/data/*.json",
  "src/pi_ai/providers/data/.manifest.json",
  "src/pi_ai/providers/data/images/*.json",
]

[tool.hatch.build.targets.sdist]
artifacts = [
  "src/pi_ai/providers/data/*.json",
  "src/pi_ai/providers/data/.manifest.json",
  "src/pi_ai/providers/data/images/*.json",
]

[tool.uv.sources]
pi-telemetry = { workspace = true }
