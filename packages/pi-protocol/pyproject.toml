[project]
name = "pi-protocol"
version = "0.0.1"
description = "RPC protocol types (Python port of @earendil-works/pi-protocol)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_protocol"]

[tool.uv.sources]

