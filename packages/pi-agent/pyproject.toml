[project]
name = "pp-agent-core"
version = "0.1.0"
description = "General-purpose agent with transport abstraction, state management, and attachment support (Python port of @earendil-works/pi-agent-core)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mario Zechner" }]
maintainers = [{ name = "Hangxing Wei", email = "HSPK@users.noreply.github.com" }]
keywords = ["ai", "agent", "llm", "transport", "state-management", "pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pp-ai==0.1.0",
    "pp-telemetry==0.1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/HSPK/pp"
Repository = "https://github.com/HSPK/pp"
Issues = "https://github.com/HSPK/pp/issues"
Upstream = "https://github.com/earendil-works/pi/tree/main/packages/agent"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent"]

[tool.uv.sources]
pp-ai = { workspace = true }
pp-telemetry = { workspace = true }
