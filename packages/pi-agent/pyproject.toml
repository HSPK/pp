[project]
name = "pi-agent"
version = "0.0.1"
description = "Agent loop and harness (Python port of @earendil-works/pi-agent-core)"
requires-python = ">=3.11"
dependencies = [
    "pi-ai",
    "pi-telemetry",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent"]

[tool.uv.sources]
pi-ai = { workspace = true }
pi-telemetry = { workspace = true }
