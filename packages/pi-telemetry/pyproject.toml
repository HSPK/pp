[project]
name = "pp-telemetry"
version = "0.1.0"
description = "Vendor-neutral telemetry contracts and typed schema utilities for pi (Python port of @earendil-works/pi-telemetry)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mario Zechner" }]
maintainers = [{ name = "Hangxing Wei", email = "HSPK@users.noreply.github.com" }]
keywords = ["telemetry", "tracing", "observability", "pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/HSPK/pp"
Repository = "https://github.com/HSPK/pp"
Issues = "https://github.com/HSPK/pp/issues"
Upstream = "https://github.com/earendil-works/pi/tree/main/packages/telemetry"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_telemetry"]

[tool.uv.sources]
