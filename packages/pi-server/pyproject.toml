[project]
name = "pi-server"
version = "0.0.1"
description = "RPC server (Python port of @earendil-works/pi-server)"
requires-python = ">=3.11"
dependencies = [
    "pi-protocol",
    "pi-agent",
    "pi-ai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_server"]

[tool.uv.sources]
pi-protocol = { workspace = true }
pi-agent = { workspace = true }
pi-ai = { workspace = true }
pi-client = { workspace = true }

[dependency-groups]
# pi-client is a test-only dependency: it lets this package's test suite run a
# real client against a real server for the cross-package integration test.
# It is never imported from `src/pi_server`.
test = ["pi-client"]
