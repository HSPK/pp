[project]
name = "pp-rpc-server"
version = "0.1.0"
description = "Experimental RPC server for remote pi sessions over framed CBOR bytes (Python port of @earendil-works/pi-server)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Earendil Works" }]
maintainers = [{ name = "Hangxing Wei", email = "HSPK@users.noreply.github.com" }]
keywords = ["pi", "server", "protocol", "cbor", "rpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pp-rpc-protocol==0.1.0",
    "pp-agent-core==0.1.0",
    "pp-ai==0.1.0",
]

[project.urls]
Homepage = "https://github.com/HSPK/pp"
Repository = "https://github.com/HSPK/pp"
Issues = "https://github.com/HSPK/pp/issues"
Upstream = "https://github.com/earendil-works/pi/tree/main/packages/server"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_server"]

[tool.uv.sources]
pp-rpc-protocol = { workspace = true }
pp-agent-core = { workspace = true }
pp-ai = { workspace = true }
pp-rpc-client = { workspace = true }

[dependency-groups]
# pp-rpc-client is a test-only dependency: it lets this package's test suite run
# a real client against a real server for the cross-package integration test.
# It is never imported from `src/pi_server`.
test = ["pp-rpc-client"]
