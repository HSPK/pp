[project]
name = "pi-client"
version = "0.0.1"
description = "RPC client (Python port of @earendil-works/pi-client)"
requires-python = ">=3.11"
dependencies = [
    "pi-protocol",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_client"]

[tool.uv.sources]
pi-protocol = { workspace = true }
