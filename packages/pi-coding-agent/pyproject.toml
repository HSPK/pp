[project]
name = "pp-coding-agent"
version = "0.1.0"
description = "Coding agent CLI with read, bash, edit, write tools and session management (Python port of @earendil-works/pi-coding-agent)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mario Zechner" }]
maintainers = [{ name = "Hangxing Wei", email = "HSPK@users.noreply.github.com" }]
keywords = ["coding-agent", "ai", "llm", "cli", "tui", "agent", "pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    "pp-ai==0.1.0",
    "pp-agent-core==0.1.0",
    "pp-tui==0.1.0",
    "pp-rpc-protocol==0.1.0",
    "pp-rpc-client==0.1.0",
    "pp-rpc-server==0.1.0",
    "pp-telemetry==0.1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "pillow>=11.0",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/HSPK/pp"
Repository = "https://github.com/HSPK/pp"
Issues = "https://github.com/HSPK/pp/issues"
Documentation = "https://github.com/HSPK/pp/tree/main/packages/pi-coding-agent/docs"
Upstream = "https://github.com/earendil-works/pi/tree/main/packages/coding-agent"

[project.scripts]
pp = "pi_coding_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_coding_agent"]

# `docs/`, `examples/` and `README.md` are read at runtime, not just published:
# the system prompt points the model at them so it can answer questions about
# pi itself (see `core/config.py`'s `get_docs_path`). They must land inside the
# installed package, or that capability silently disappears in a wheel install.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "pi_coding_agent/docs"
"examples" = "pi_coding_agent/examples"
"README.md" = "pi_coding_agent/README.md"

[tool.uv.sources]
pp-ai = { workspace = true }
pp-agent-core = { workspace = true }
pp-tui = { workspace = true }
pp-rpc-protocol = { workspace = true }
pp-rpc-client = { workspace = true }
pp-rpc-server = { workspace = true }
pp-telemetry = { workspace = true }
