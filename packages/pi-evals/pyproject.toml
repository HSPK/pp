[project]
name = "pi-evals"
version = "0.0.1"
description = "Behavioral, model-backed evals for Pi workflows (Python port of @earendil-works/pi)"
requires-python = ">=3.11"
dependencies = [
    "pi-ai",
    "pi-agent",
    "pi-coding-agent",
    "pytest>=8.3",
]

[project.scripts]
pp-evals = "pi_evals.run_evals:main"

[project.entry-points.pytest11]
pi_evals = "pi_evals.vitest_evals.reporter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_evals"]

[tool.uv.sources]
pi-ai = { workspace = true }
pi-agent = { workspace = true }
pi-coding-agent = { workspace = true }
